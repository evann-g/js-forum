<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil — Mon Forum</title>
    <link rel="stylesheet" href="/css/forum.css" />
    <link rel="stylesheet" href="/css/spa.css">
</head>
<body>

<div class="navbar">
    <button class="toggle-btn" id="toggleBtn">&#9776;</button>
    <span class="navbar-brand" style="cursor:pointer" onclick="window.location.href='/'">Mon forum</span>
    <div class="navbar-actions">
        <button class="theme-btn" id="themeBtn">🌙</button>
        <button class="btn btn-outline" onclick="window.location.href='/'">Retour au forum</button>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">Mon compte</div>
    <div class="sidenav">
        <a href="/" >🏠 Accueil</a>
        <a href="#mes-posts" class="active">📝 Mes posts</a>
        <a href="#mes-likes">❤️ Posts aimés</a>
    </div>
</div>

<div class="feed">
    <div id="profile-content"><p style="color:var(--text-sec)">Chargement…</p></div>
</div>

<script>
const themeBtn = document.getElementById('themeBtn');
function applyTheme() {
    const dark = localStorage.getItem('theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    themeBtn.textContent = dark ? '☀️' : '🌙';
}
themeBtn.addEventListener('click', () => {
    const isDark = document.body.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    themeBtn.textContent = isDark ? '☀️' : '🌙';
});
applyTheme();
document.getElementById('toggleBtn').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('collapsed'));

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function timeAgo(iso) {
    const diff = (Date.now() - new Date(iso+(iso.endsWith('Z')?'':'Z')).getTime())/1000;
    if (diff<60) return "à l'instant"; if (diff<3600) return Math.floor(diff/60)+' min';
    if (diff<86400) return Math.floor(diff/3600)+' h'; return new Date(iso).toLocaleDateString('fr-FR');
}

async function init() {
    const content = document.getElementById('profile-content');
    let user;
    try {
        const me = await fetch('/api/auth/me').then(r=>r.json());
        user = me.user;
    } catch(_) {}

    if (!user) {
        content.innerHTML = '<p style="color:var(--text-sec)">Vous n\'êtes pas connecté. <a href="/login">Se connecter</a></p>';
        return;
    }

    const [myPosts, likedPosts] = await Promise.all([
        fetch(`/api/posts?user_id=${user.id}`).then(r=>r.json()).catch(()=>[]),
        fetch(`/api/posts?liked_by=${user.id}`).then(r=>r.json()).catch(()=>[]),
    ]);

    const postCard = p => `
        <div class="thread" onclick="window.location.href='/?post=${p.id}'" style="cursor:pointer;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:8px;padding:14px 18px;margin-bottom:10px">
            <h4>${esc(p.title)}</h4>
            <div class="meta">${timeAgo(p.created_at)} · ▲ ${p.likes} ▼ ${p.dislikes}</div>
        </div>
    `;

    content.innerHTML = `
        <div class="profile-card">
            <h2>👤 ${esc(user.username)}</h2>
            <div class="meta">${esc(user.email||'')} · Membre depuis ${new Date(user.created_at).toLocaleDateString('fr-FR')}</div>
            <button class="logout-btn" onclick="logout()">Se déconnecter</button>
        </div>

        <div id="mes-posts">
            <div class="section-title">📝 Mes posts (${myPosts.length})</div>
            ${myPosts.length ? myPosts.map(postCard).join('') : '<p style="color:var(--text-sec);font-size:14px">Aucun post pour l\'instant.</p>'}
        </div>

        <div id="mes-likes">
            <div class="section-title">❤️ Posts aimés (${likedPosts.length})</div>
            ${likedPosts.length ? likedPosts.map(postCard).join('') : '<p style="color:var(--text-sec);font-size:14px">Aucun post aimé.</p>'}
        </div>
    `;
}

async function logout() {
    await fetch('/api/auth/logout', {method:'POST'}).catch(()=>{});
    window.location.href = '/login';
}

init();
</script>
</body>
</html>
