<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/inscription.css">
    <link rel="stylesheet" href="/css/spa.css">
    <title>Inscription — Mon Forum</title>
</head>
<body>
    <div class="nomsite"><h1>Mon forum</h1></div>
    <div class="page-center">
        <form id="inscriptionForm">
            <h1>Inscription</h1>
            <div class="field">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required placeholder="Au moins 3 caractères" autocomplete="username">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="vous@exemple.com" autocomplete="email">
            </div>
            <div class="field">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required placeholder="Au moins 8 caractères" autocomplete="new-password">
            </div>
            <div class="field">
                <label for="confirmPassword">Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Répétez le mot de passe" autocomplete="new-password">
            </div>
            <div class="msg" id="msg"></div>
            <button type="submit" id="submitBtn">Créer mon compte</button>
            <a href="/login">Déjà un compte ? Connectez-vous</a>
        </form>
    </div>
    <script>
    function showMsg(text, type) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = 'msg ' + type;
        el.style.display = 'block';
    }

    document.getElementById('inscriptionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const username = document.getElementById('username').value.trim();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm  = document.getElementById('confirmPassword').value;

        // Client-side validation
        if (username.length < 3) { showMsg("Le nom d'utilisateur doit faire au moins 3 caractères.", 'error'); return; }
        if (password.length < 8) { showMsg("Le mot de passe doit faire au moins 8 caractères.", 'error'); return; }
        if (password !== confirm) { showMsg("Les mots de passe ne correspondent pas.", 'error'); return; }

        btn.disabled = true;
        btn.textContent = 'Création en cours…';

        try {
            // Step 1: register
            const regRes = await fetch('/api/auth/inscription', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            const regData = await regRes.json();
            if (!regRes.ok) {
                const msg = regData.errors ? regData.errors.join(' ') : (regData.error || 'Erreur lors de la création du compte.');
                showMsg(msg, 'error');
                btn.disabled = false;
                btn.textContent = 'Créer mon compte';
                return;
            }

            showMsg('Compte créé ! Connexion en cours…', 'success');

            // Step 2: auto-login
            const loginRes = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            if (loginRes.ok) {
                window.location.href = '/';
            } else {
                showMsg('Compte créé ! Veuillez vous connecter.', 'success');
                setTimeout(() => window.location.href = '/login', 1500);
            }
        } catch (err) {
            showMsg('Erreur réseau — vérifiez que le serveur tourne.', 'error');
            btn.disabled = false;
            btn.textContent = 'Créer mon compte';
        }
    });

    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
    </script>
</body>
</html>
