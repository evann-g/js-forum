<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <title>Connexion — Mon Forum</title>
</head>
<body>
    <div class="nomsite">
        <h1>Mon forum</h1>
    </div>
    <div class="page-center">
        <form action="/login" method="POST">
            <h1>Connexion</h1>
            <div class="field">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required placeholder="Votre nom d'utilisateur">
            </div>
            <div class="field">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required placeholder="Votre mot de passe">
            </div>
            <p id="error-msg"></p>
            <button type="submit">Se connecter</button>
            <a href="/inscription">Pas encore de compte ? Inscrivez-vous</a>
        </form>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");
        if (error) {
            const msg = document.getElementById("error-msg");
            msg.textContent = decodeURIComponent(error);
            msg.style.display = "block";
        }
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
    </script>
</body>
</html>
