services:
  forum:
    build: .
    container_name: js-forum
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      CORS_ORIGIN: http://localhost:8000
    volumes:
      # Persist the SQLite database outside the container
      - sqlite-data:/app/database
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite-data: