<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forum</title>
    <link rel="stylesheet" href="../css/forum.css" />
</head>
<body>
    
    <div class="navbar">
        <button class="toggle-btn" id="toggleBtn" aria-label="Toggle sidebar">&#9776;</button>
        <div class="navbar-actions">
            <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode"> 🌙 </button>
            <button class="btn btn-outline" id="loginBtn"> Login </button>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Forum</div>
    
        <div class="search-bar">
            <input type="text" placeholder="Search..." />
        </div>
    
        <div class="sidenav">
            <a href="forum.html">Home</a>
            <a href="#services">Services</a>
            <a href="#clients">Clients</a>
            <a href="#contact">Contact</a>
            <button class="dropdown-btn" id="ddBtn">Dropdown
                <i class="fa fa-caret-down"></i>
            </button>
            <div class="dropdown-container" id="ddContainer">
                <a href="#">Link 1</a>
                <a href="#">Link 2</a>
                <a href="#">Link 3</a>
            </div>
            <a href="login.html"> Login </a>
        </div>
    </div>

    <div class="feed">
        <div class="content-header">Bienvenue sur le Forum</div>
        <p>Ici vous trouverez le feed</p>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleBtn');
        const ddBtn = document.getElementById('ddBtn');
        const ddContainer = document.getElementById('ddContainer');
        const themeBtn = document.getElementById('themeBtn');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        ddBtn.addEventListener('click', () => {
            ddBtn.classList.toggle('open');
            ddContainer.classList.toggle('open');
        });

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
            themeBtn.textContent = '☀️';
        }

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            themeBtn.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        loginBtn.addEventListener('click', () => {
            window.location.href = 'login.html';
        });
    </script>
    
</body>
</html>
